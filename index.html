<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tá com saudade de mim?</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(160deg, #ffd6e8, #ffeef5 55%, #ffe0ee);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }

  .screen.active { display: flex; }

  h1 {
    font-size: 7vw;
    max-font-size: 30px;
    font-size: clamp(22px, 7vw, 30px);
    color: #b3336b;
    margin: 0 0 18px;
    font-weight: 800;
    text-shadow: 1px 1px 0 #fff;
  }

  .msg {
    font-size: clamp(24px, 8vw, 34px);
    font-weight: 800;
    color: #c22a72;
    margin: 18px 0 8px;
    text-shadow: 1px 1px 0 #fff;
  }

  .submsg {
    font-size: clamp(14px, 4vw, 17px);
    color: #a15a80;
    margin: 0 0 18px;
    font-weight: 500;
  }

  .cat-wrap {
    width: min(62vw, 260px);
    filter: drop-shadow(0 8px 12px rgba(179, 51, 107, 0.25));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .buttons-area {
    position: relative;
    width: 100%;
    height: 130px;
    margin-top: 26px;
  }

  button {
    border: none;
    border-radius: 50px;
    font-size: clamp(15px, 4.5vw, 18px);
    font-weight: 800;
    padding: 16px 30px;
    cursor: pointer;
    font-family: inherit;
  }

  #btnSim {
    background: linear-gradient(145deg, #ff8fb3, #ff5f96);
    color: #fff;
    box-shadow: 0 6px 0 #d63d76, 0 10px 16px rgba(214, 61, 118, 0.3);
    position: absolute;
    left: 50%;
    top: 14px;
    transform: translateX(-50%);
    transition: transform 0.08s ease;
  }

  #btnSim:active {
    transform: translateX(-50%) translateY(4px);
    box-shadow: 0 2px 0 #d63d76, 0 4px 8px rgba(214, 61, 118, 0.3);
  }

  #btnNao {
    background: #fff;
    color: #b3336b;
    border: 2.5px solid #ffb3cf;
    position: absolute;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    transition: left 0.16s ease-out, top 0.16s ease-out;
    white-space: nowrap;
    z-index: 5;
  }

  .btn-restart {
    margin-top: 26px;
    background: #fff;
    color: #b3336b;
    border: 2.5px solid #ffb3cf;
    padding: 13px 26px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 15px;
  }
</style>
</head>
<body>

  <div class="screen active" id="screenHome">
    <h1>Tá com saudade de mim?</h1>

    <div class="cat-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="185" rx="70" ry="10" fill="#f4a6c6" opacity="0.35"/>
        <path d="M55 60 L40 15 L80 45 Z" fill="#ffb7d3"/>
        <path d="M145 60 L160 15 L120 45 Z" fill="#ffb7d3"/>
        <path d="M58 58 L48 28 L74 48 Z" fill="#ff87b3"/>
        <path d="M142 58 L152 28 L126 48 Z" fill="#ff87b3"/>
        <circle cx="100" cy="110" r="72" fill="#ffd7e6"/>
        <ellipse cx="70" cy="112" rx="9" ry="12" fill="#5c3548"/>
        <ellipse cx="130" cy="112" rx="9" ry="12" fill="#5c3548"/>
        <circle cx="73" cy="107" r="3" fill="#fff"/>
        <circle cx="133" cy="107" r="3" fill="#fff"/>
        <ellipse cx="52" cy="128" rx="12" ry="8" fill="#ff9dc0" opacity="0.8"/>
        <ellipse cx="148" cy="128" rx="12" ry="8" fill="#ff9dc0" opacity="0.8"/>
        <path d="M92 128 Q100 136 108 128 Q100 132 92 128 Z" fill="#ff6fa5"/>
        <path d="M100 130 Q94 145 78 140" stroke="#5c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M100 130 Q106 145 122 140" stroke="#5c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
        <line x1="20" y1="108" x2="50" y2="112" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="120" x2="50" y2="120" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="108" x2="150" y2="112" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="120" x2="150" y2="120" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="buttons-area" id="buttonsArea">
      <button id="btnSim" onclick="showScreen('screenSim')">SIM, MUITO</button>
      <button id="btnNao">NÃO</button>
    </div>
  </div>

  <div class="screen" id="screenSim">
    <div class="msg">OOOOWN SABIAAAAA 🩷</div>
    <div class="cat-wrap">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="185" rx="70" ry="10" fill="#f4a6c6" opacity="0.35"/>
        <path d="M55 60 L40 15 L80 45 Z" fill="#ffb7d3"/>
        <path d="M145 60 L160 15 L120 45 Z" fill="#ffb7d3"/>
        <path d="M58 58 L48 28 L74 48 Z" fill="#ff87b3"/>
        <path d="M142 58 L152 28 L126 48 Z" fill="#ff87b3"/>
        <circle cx="100" cy="110" r="72" fill="#ffd7e6"/>
        <path d="M62 108 Q70 96 78 108 Q70 100 62 108 Z" fill="#ff5c94"/>
        <path d="M122 108 Q130 96 138 108 Q130 100 122 108 Z" fill="#ff5c94"/>
        <ellipse cx="52" cy="128" rx="13" ry="9" fill="#ff8fbd"/>
        <ellipse cx="148" cy="128" rx="13" ry="9" fill="#ff8fbd"/>
        <path d="M92 128 Q100 136 108 128 Q100 132 92 128 Z" fill="#ff6fa5"/>
        <path d="M78 132 Q100 158 122 132" stroke="#5c3548" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <line x1="20" y1="108" x2="50" y2="112" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="120" x2="50" y2="120" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="108" x2="150" y2="112" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="120" x2="150" y2="120" stroke="#c76a94" stroke-width="2" stroke-linecap="round"/>
        <path d="M30 45 Q40 30 55 40" stroke="#ff87b3" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M170 45 Q160 30 145 40" stroke="#ff87b3" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <button class="btn-restart" onclick="showScreen('screenHome')">voltar</button>
  </div>

  <div class="screen" id="screenInvalid">
    <div class="msg" style="color:#7a5a6b;">resposta inválida,<br>tente de novo</div>
    <div class="cat-wrap" style="width:min(52vw, 220px);">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="185" rx="65" ry="9" fill="#c9c3d6" opacity="0.35"/>
        <path d="M55 60 L40 15 L80 45 Z" fill="#d9c9e0"/>
        <path d="M145 60 L160 15 L120 45 Z" fill="#d9c9e0"/>
        <path d="M58 58 L48 28 L74 48 Z" fill="#c3a9d3"/>
        <path d="M142 58 L152 28 L126 48 Z" fill="#c3a9d3"/>
        <circle cx="100" cy="112" r="72" fill="#e6d9ec"/>
        <path d="M60 112 Q70 105 80 112" stroke="#5c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M120 112 Q130 105 140 112" stroke="#5c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="52" cy="130" rx="11" ry="7" fill="#c3a9d3" opacity="0.7"/>
        <ellipse cx="148" cy="130" rx="11" ry="7" fill="#c3a9d3" opacity="0.7"/>
        <path d="M92 130 Q100 137 108 130 Q100 133 92 130 Z" fill="#8a6d99"/>
        <path d="M82 148 Q100 138 118 148" stroke="#5c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M65 120 Q62 138 58 148" stroke="#6fb3e6" stroke-width="4" fill="none" stroke-linecap="round"/>
        <line x1="20" y1="110" x2="50" y2="114" stroke="#9d84ab" stroke-width="2" stroke-linecap="round"/>
        <line x1="20" y1="122" x2="50" y2="122" stroke="#9d84ab" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="110" x2="150" y2="114" stroke="#9d84ab" stroke-width="2" stroke-linecap="round"/>
        <line x1="180" y1="122" x2="150" y2="122" stroke="#9d84ab" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <button class="btn-restart" onclick="showScreen('screenHome')">tentar de novo</button>
  </div>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  var btnNao = document.getElementById('btnNao');
  var area = document.getElementById('buttonsArea');

  function moveBtnNao(avoidX, avoidY) {
    var areaRect = area.getBoundingClientRect();
    var btnW = btnNao.offsetWidth || 90;
    var btnH = btnNao.offsetHeight || 50;

    var maxLeft = areaRect.width - btnW;
    var maxTop = areaRect.height - btnH;

    var newLeft, newTop, tries = 0;
    do {
      newLeft = Math.random() * Math.max(maxLeft, 0);
      newTop = Math.random() * Math.max(maxTop, 0);
      tries++;
    } while (
      avoidX !== undefined &&
      Math.hypot((newLeft + btnW / 2) - avoidX, (newTop + btnH / 2) - avoidY) < 90 &&
      tries < 8
    );

    btnNao.style.left = newLeft + 'px';
    btnNao.style.top = newTop + 'px';
    btnNao.style.transform = 'none';
  }

  function relPos(clientX, clientY) {
    var r = area.getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }

  // Foge quando o mouse chega perto (desktop)
  document.addEventListener('mousemove', function (e) {
    var btnRect = btnNao.getBoundingClientRect();
    var cx = btnRect.left + btnRect.width / 2;
    var cy = btnRect.top + btnRect.height / 2;
    var dist = Math.hypot(e.clientX - cx, e.clientY - cy);
    if (dist < 80) {
      var p = relPos(e.clientX, e.clientY);
      moveBtnNao(p.x, p.y);
    }
  });

  // Foge assim que é tocado/aproximado no celular
  btnNao.addEventListener('touchstart', function (e) {
    e.preventDefault();
    var t = e.touches[0];
    var p = relPos(t.clientX, t.clientY);
    moveBtnNao(p.x, p.y);
  }, { passive: false });

  area.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    var p = relPos(t.clientX, t.clientY);
    moveBtnNao(p.x, p.y);
  }, { passive: false });

  btnNao.addEventListener('mouseenter', function () {
    moveBtnNao();
  });

  // Caso, contra todas as chances, consigam clicar
  btnNao.addEventListener('click', function () {
    showScreen('screenInvalid');
  });

  // posição inicial e mexe sozinho de vez em quando pra provocar
  moveBtnNao();
  setInterval(function () {
    if (document.getElementById('screenHome').classList.contains('active')) {
      moveBtnNao();
    }
  }, 2200);
</script>

</body>
</html>
